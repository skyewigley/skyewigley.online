# Local test of the production image (same Dockerfile Coolify builds).
# Usage:
#   docker compose -f docker-compose.local.yml --env-file .env.local up --build
# Then open http://localhost:8080
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_NAME: ${NEXT_PUBLIC_NAME:-}
        NEXT_PUBLIC_INITIALS: ${NEXT_PUBLIC_INITIALS:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
        NEXT_PUBLIC_INTRO_VIDEO_ID: ${NEXT_PUBLIC_INTRO_VIDEO_ID:-}
        NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
        NEXT_PUBLIC_YOUTUBE_URL: ${NEXT_PUBLIC_YOUTUBE_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_UPWORK_URL: ${NEXT_PUBLIC_UPWORK_URL:-}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
        NEXT_PUBLIC_DISCORD: ${NEXT_PUBLIC_DISCORD:-}
        NEXT_PUBLIC_CONTACT_WEBHOOK_URL: ${NEXT_PUBLIC_CONTACT_WEBHOOK_URL:-}
    ports:
      - "8080:80"
